  <polygon points="64,96 74,102 74,110 64,104" fill="#8957e5"/>
  <polygon points="176,104 186,110 196,104 186,98" fill="#d3b8ff"/>
  <polygon points="176,104 186,110 186,118 176,112" fill="#8957e5"/>
