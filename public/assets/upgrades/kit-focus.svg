<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8d99"/><stop offset="1" stop-color="#516270"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c6f7e"/><stop offset="1" stop-color="#2c3a46"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfb18b"/><stop offset="1" stop-color="#9e6d47"/></linearGradient>
    <radialGradient id="plasma"><stop offset="0" stop-color="#f2e6ff"/><stop offset=".45" stop-color="#a874ff"/><stop offset="1" stop-color="#4e38c2"/></radialGradient>
