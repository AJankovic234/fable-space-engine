<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8d99"/><stop offset="1" stop-color="#526370"/></linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2b285"/><stop offset="1" stop-color="#9e6334"/></linearGradient>
    <radialGradient id="amberCore"><stop offset="0" stop-color="#fff4cc"/><stop offset=".45" stop-color="#ffb042"/><stop offset="1" stop-color="#d95814"/></radialGradient>
  </defs>
  <!-- Octagonal baseplate -->
