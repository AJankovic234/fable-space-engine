server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text- und Modellformate komprimiert ausliefern
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # Vite haengt einen Content-Hash an JS/CSS-Bundles unter /assets/ -
    # nur diese duerfen unbegrenzt immutable gecacht werden.
    location ~* "^/assets/.*-[a-zA-Z0-9_-]{8}[.](js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Statische Assets ohne Hash (sfx, models, png, svg) ueber ETag revalidieren.
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html nie cachen, damit ein neues Deployment sofort sichtbar ist.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
